<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e7a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CV Vendas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Cheiro Verde – Vendas</title>
<style>
  :root{
    --green:#289548; --green-d:#1e7a3a; --green-dd:#145a2a; --lime:#afcb09; --lime-soft:#f2f7d9;
    --bg:#f3f6f1; --surface:#fff; --ink:#18261c; --muted:#66756a; --line:#e1e8de;
    --red:#d64545; --red-bg:#fdeaea; --orange:#ef8a00; --orange-bg:#fff1dc; --ok:#289548; --ok-bg:#e3f4e8;
    --blue:#2a6fdb; --blue-bg:#e8f0fd;
    --radius:18px; --shadow:0 1px 2px rgba(20,50,30,.06),0 6px 18px rgba(20,50,30,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font:inherit}
  .hidden{display:none!important}
  a{color:var(--green-d)}

  /* ---------- Login ---------- */
  #login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 32px) 24px 32px;
    background:radial-gradient(120% 70% at 100% 0%,#34a95a 0%,transparent 60%),linear-gradient(165deg,var(--green) 0%,var(--green-dd) 100%);color:#fff}
  #login .brand{width:230px;max-width:70%;margin-bottom:28px}
  #login h1{margin:0 0 4px;font-size:26px;font-weight:700}
  #login p.lead{margin:0 0 26px;opacity:.85}
  .lfield{display:block;margin-bottom:14px}
  .lfield span{display:block;font-size:13px;margin-bottom:6px;opacity:.9;font-weight:500}
  .lfield input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:16px;outline:none}
  .lfield input::placeholder{color:rgba(255,255,255,.55)}
  .lfield input:focus{border-color:var(--lime);background:rgba(255,255,255,.18)}
  .btn-white{width:100%;padding:15px;border-radius:12px;background:#fff;color:var(--green-d);font-weight:700;font-size:16px;margin-top:6px}
  .btn-outline{width:100%;padding:14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:600;margin-top:12px}
  .aviso{background:rgba(175,203,9,.2);border:1px solid rgba(175,203,9,.6);border-radius:12px;padding:10px 12px;font-size:14px;margin:-10px 0 18px}
  .lerr{color:#ffe0e0;background:rgba(214,69,69,.25);border-radius:10px;padding:0;font-size:14px;margin-top:12px}
  .lerr:not(:empty){padding:10px 12px}

  /* ---------- Cabeçalho ---------- */
  header.top{position:sticky;top:0;z-index:5;background:var(--green-d);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:10px}
  header.top h2{margin:0;font-size:18px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);flex:none}
  .hero{background:radial-gradient(110% 80% at 100% 0%,#34a95a 0%,transparent 55%),linear-gradient(165deg,var(--green) 0%,var(--green-dd) 100%);color:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 16px 64px;position:relative}
  .hero .bar{display:flex;align-items:center;justify-content:space-between}
  .hero .brand{height:44px}
  .hero .hi{margin-top:18px;font-size:15px;opacity:.85}
  .hero .hi b{display:block;font-size:24px;opacity:1;font-weight:700;margin-top:2px}
  main{padding:16px 16px calc(env(safe-area-inset-bottom) + 110px);max-width:720px;margin:0 auto}
  main.lift{margin-top:-48px;position:relative}

  /* ---------- Meta ---------- */
  .goal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .goal .gt{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:500}
  .goal .gnum{display:flex;align-items:baseline;gap:6px;margin:8px 0 12px}
  .goal .gnum b{font-size:38px;line-height:1;font-weight:800}
  .goal .gnum span{color:var(--muted);font-size:16px}
  .goal .pct{font-weight:800;font-size:15px;padding:4px 10px;border-radius:999px}
  .track{height:12px;border-radius:999px;background:#edf1ea;overflow:hidden}
  .fill{height:100%;border-radius:999px;transition:width .6s ease}
  .goal .gfoot{margin-top:10px;font-size:13px;color:var(--muted)}
  .g-red .fill{background:var(--red)} .g-red .pct{background:var(--red-bg);color:var(--red)} .g-red .gnum b{color:var(--red)}
  .g-orange .fill{background:var(--orange)} .g-orange .pct{background:var(--orange-bg);color:#b86a00} .g-orange .gnum b{color:#c77400}
  .g-lime .fill{background:var(--lime)} .g-lime .pct{background:var(--lime-soft);color:#6f8200} .g-lime .gnum b{color:#7f9400}
  .g-green .fill{background:var(--ok)} .g-green .pct{background:var(--ok-bg);color:var(--ok)} .g-green .gnum b{color:var(--ok)}
  .g-none .fill{background:#c9d2c6} .g-none .pct{background:#eef1ec;color:var(--muted)}

  /* ---------- Cards em lista (home) ---------- */
  .menu{display:flex;flex-direction:column;gap:12px}
  .mcard{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:left;width:100%;transition:transform .1s}
  .mcard:active{transform:scale(.985)}
  .mcard .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
  .mcard .tx{flex:1;min-width:0}
  .mcard .tx b{display:block;font-size:17px;font-weight:600}
  .mcard .tx small{color:var(--muted);font-size:13px}
  .mcard .n{font-size:30px;font-weight:800;min-width:40px;text-align:right}
  .mcard .chev{color:#b5c0b2}
  .ic-lime{background:var(--lime-soft);color:#7f9400}
  .ic-blue{background:var(--blue-bg);color:var(--blue)}
  .ic-green{background:var(--ok-bg);color:var(--ok)}

  /* ---------- Cards de cliente ---------- */
  .list{display:flex;flex-direction:column;gap:12px}
  .ccard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border-left:5px solid var(--lime)}
  .ccard.done{border-left-color:var(--green)}
  .ccard.prop{border-left-color:var(--blue)}
  .ccard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ccard .nm{font-weight:700;font-size:17px;line-height:1.25}
  .ccard .ln{font-size:14px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
  .ccard .ln svg{flex:none;margin-top:2px}
  .tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .t-lime{background:var(--lime-soft);color:#6f8200} .t-ok{background:var(--ok-bg);color:var(--ok)} .t-blue{background:var(--blue-bg);color:var(--blue)} .t-grey{background:#eef1ec;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}
  .empty svg{opacity:.35;margin-bottom:10px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#e4ebe1;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted);text-transform:capitalize}
  .seg button.on{background:var(--surface);color:var(--green-d);box-shadow:var(--shadow)}

  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);height:56px;padding:0 22px;border-radius:28px;
    background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(30,122,58,.4);z-index:6}

  /* ---------- Formulários ---------- */
  .sec{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .sec h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sec h3 .req{font-size:11px;font-weight:700;color:var(--red);background:var(--red-bg);padding:3px 8px;border-radius:999px}
  .sec h3 .okk{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:3px 8px;border-radius:999px}
  .f{display:block;margin-bottom:14px}
  .f:last-child{margin-bottom:0}
  .f > span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
  .f > span i{color:var(--red);font-style:normal}
  .f input,.f select,.f textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fbfcfa;font-size:16px;color:var(--ink);outline:none}
  .f textarea{min-height:96px;resize:vertical}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--green);background:#fff}
  .f.bad input,.f.bad textarea{border-color:var(--red);background:#fff8f8}
  .f .msg{display:none;color:var(--red);font-size:13px;margin-top:5px}
  .f.bad .msg{display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid-num{display:grid;grid-template-columns:1fr 110px;gap:12px}
  .suffix{position:relative}
  .suffix input{padding-right:78px}
  .suffix em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:14px;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fbfcfa;font-weight:600;font-size:14px}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .mod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mod button{padding:16px 10px;border-radius:14px;border:2px solid var(--line);background:#fbfcfa;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
  .mod button.on{border-color:var(--green);background:var(--ok-bg);color:var(--green-d)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:15px}
  .btn-green{background:var(--green);color:#fff}
  .btn-lime{background:var(--lime);color:#1d2a05}
  .btn-soft{background:#eef3eb;color:var(--green-d)}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-ghost{color:var(--muted)}
  .btn + .btn{margin-top:10px}
  .bottom-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(243,246,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:6}
  .bottom-bar .btn{max-width:688px;margin:0 auto}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
  .kv dt{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;padding-top:2px}
  .kv dd{margin:0;word-break:break-word}
  .linkbtn{font-size:13px;font-weight:700;color:var(--green-d);padding:4px 8px;border-radius:8px;background:#eef3eb}

  .checkin{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--ok-bg)}
  .checkin .pin{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
  .checkin small{display:block;color:var(--muted);font-size:13px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e9eee6}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
  .ph.add{border:2px dashed #c6d2c1;background:#f7faf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--green-d);font-weight:600;font-size:13px}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .prop-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .prop-sum div{background:#f5f8f3;border-radius:12px;padding:10px 12px}
  .prop-sum small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .prop-sum b{font-size:16px}
  .result{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);margin-bottom:14px;font-weight:600}
  .result.contrato{background:var(--ok-bg);color:var(--green-d)}
  .result.proposta{background:var(--blue-bg);color:var(--blue)}

  /* ---------- Calendário ---------- */
  .cal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
  .cal-sum{display:flex;gap:18px;padding:4px 4px 12px;font-size:13px;color:var(--muted)}
  .cal-sum b{color:var(--ink);font-size:20px;display:block}
  .wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wk div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
  .day{aspect-ratio:1/1.1;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:6px;font-size:14px;font-weight:600}
  .day.out{visibility:hidden}
  .day.today{outline:2px solid var(--lime);outline-offset:-2px}
  .day.has{background:#eaf5ed}
  .day.sel{background:var(--green);color:#fff}
  .day .cnt{font-size:10px;font-weight:700;color:var(--green-d);margin-top:1px}
  .day.sel .cnt{color:#e6f5c2}
  .day .dots{display:flex;gap:3px;margin-top:auto;margin-bottom:6px}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .dot.p{background:var(--blue)} .dot.c{background:var(--lime)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:10px 4px 2px}
  .legend span{display:flex;align-items:center;gap:5px}
  .day-title{margin:20px 2px 10px;font-size:16px;font-weight:700}
  .day-title small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}

  /* ---------- Sheet / toast / visualizador ---------- */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .sheet-bg{position:fixed;inset:0;background:rgba(10,30,15,.5);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
  .sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:720px;margin:0 auto;animation:up .2s ease}
  .sheet .grab{width:44px;height:5px;border-radius:3px;background:#d7ded4;margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font-size:20px} .sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);margin-bottom:10px;text-align:left}
  .opt b{display:block;font-size:16px} .opt small{color:var(--muted)}
  .opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
  .missing{background:var(--red-bg);color:#9b2c2c;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
  .missing ul{margin:6px 0 0;padding-left:18px}
  .viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
  .viewer img{max-width:100%;max-height:100%}
  .viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:45;display:grid;place-items:center;font-weight:600;color:var(--green-d)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- ================= LOGIN / PRIMEIRO ACESSO ================= -->
<section id="login" class="hidden">
  <img class="brand" src="logo.svg" alt="Cheiro Verde Ambiental">

  <form id="loginForm" autocomplete="on" novalidate>
    <h1>Área do Vendedor</h1>
    <p class="lead">Entre para acompanhar suas visitas e contratos.</p>
    <label class="lfield"><span>CPF</span><input id="lCpf" name="username" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14"></label>
    <label class="lfield"><span>Senha</span><input id="lPass" name="password" type="password" autocomplete="current-password" placeholder="Sua senha"></label>
    <button class="btn-white" type="submit">Entrar</button>
    <button class="btn-outline" type="button" id="goCadastro">Primeiro acesso</button>
    <div class="lerr" id="loginErr"></div>
  </form>

  <form id="cadForm" class="hidden" autocomplete="on" novalidate>
    <h1>Primeiro acesso</h1>
    <p class="lead">Crie seu cadastro para usar o aplicativo.</p>
    <div id="cadAviso" class="aviso hidden">Este CPF ainda não tem cadastro. Complete os dados abaixo para criar seu acesso.</div>
    <label class="lfield"><span>Nome completo</span><input id="cNome" autocomplete="name" placeholder="Seu nome completo"></label>
    <label class="lfield"><span>CPF</span><input id="cCpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14"></label>
    <label class="lfield"><span>Senha</span><input id="cPass" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></label>
    <label class="lfield"><span>Repetir senha</span><input id="cPass2" type="password" autocomplete="new-password" placeholder="Digite a senha novamente"></label>
    <button class="btn-white" type="submit">Criar cadastro</button>
    <button class="btn-outline" type="button" id="goLogin">Já tenho cadastro</button>
    <div class="lerr" id="cadErr"></div>
  </form>
</section>

<!-- ================= APP ================= -->
<section id="app" class="hidden">
  <div id="topArea"></div>
  <main id="view"></main>
  <button class="fab hidden" id="fab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Novo cliente
  </button>
</section>

<!-- Presencial: somente câmera · Virtual: galeria permitida -->
<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileGaleria" accept="image/*" class="hidden">
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
// Meta mensal de contratos. PROVISÓRIO: quando o dashboard do gestor
// estiver pronto, este valor virá de lá. Use null para "meta não definida".
const META_MENSAL = 10;
const VERSAO = '3';

/* =========================================================
   ARMAZENAMENTO
   - Usuários e clientes: localStorage do aparelho
   - Fotos: IndexedDB (cabe muito mais que o localStorage)
   ========================================================= */
const K_USERS = 'cv_usuarios', K_SESSION = 'cv_sessao';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Sem espaço para salvar no aparelho'); return false; } };

const FotoDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('cv_fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('fotos', mode), s = t.objectStore('fotos'), r = fn(s);
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  }); };
  return {
    put: (id, data) => tx('readwrite', s => s.put(data, id)),

})();

// Máscaras
const maskCPF = v => { v = digits(v).slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); };
const maskDoc = v => { const d = digits(v).slice(0,14); if (d.length <= 11) return maskCPF(d);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); };
const maskFone = v => { const d = digits(v).slice(0,11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; };
const maskMoney = v => { const d = digits(v).replace(/^0+/, ''); if (!d) return ''; const n = d.padStart(3,'0');
  const int = n.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return 'R$ ' + int + ',' + n.slice(-2); };
const maskInt = v => digits(v).slice(0,7).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

// Validações
function validCPF(v){ const c = digits(v); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++){ let s = 0; for (let i = 0; i < t; i++) s += c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 != c[t]) return false; } return true; }
function validCNPJ(v){ const c = digits(v); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++){ s += c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) == c[12] && calc(13) == c[13]; }
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());

async function hash(s){
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  catch (e) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'x' + h; }
}

function metaHTML(){
  const hoje = new Date(), feitos = contratosMes().length, nomeMes = MESES[hoje.getMonth()];
  if (!META_MENSAL) return `<div class="goal g-none">
      <div class="gt"><span>Meta de ${nomeMes}</span><span class="pct">a definir</span></div>
      <div class="gnum"><b>${feitos}</b><span>contratos fechados</span></div>
      <div class="track"><div class="fill" style="width:0"></div></div>
      <div class="gfoot">A meta do mês será definida pelo gestor.</div></div>`;
  const pct = Math.round(feitos / META_MENSAL * 100);
  // 0–50% vermelho · 50–89% laranja · 89–99% amarelo-esverdeado · 100%+ verde
  const real = feitos / META_MENSAL * 100;
  const cls = real >= 100 ? 'g-green' : real >= 89 ? 'g-lime' : real > 50 ? 'g-orange' : 'g-red';
  const falta = Math.max(0, META_MENSAL - feitos);
  const diasRest = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate() - hoje.getDate();
  const foot = falta === 0 ? 'Meta batida! Parabéns 🎉' : `Faltam <b>${falta}</b> contrato${falta > 1 ? 's' : ''} · ${diasRest} dia${diasRest !== 1 ? 's' : ''} restante${diasRest !== 1 ? 's' : ''} no mês`;
  return `<div class="goal ${cls}">
      <div class="gt"><span>Meta de ${nomeMes}</span><span class="pct">${pct}%</span></div>
      <div class="gnum"><b>${feitos}</b><span>de ${META_MENSAL} contratos</span></div>
      <div class="track"><div class="fill" style="width:${Math.min(pct, 100)}%"></div></div>
      <div class="gfoot">${foot}</div></div>`;
}

      else if (f.k === 'doc' && v && !(digits(v).length === 11 ? validCPF(v) : validCNPJ(v))) m = 'CPF ou CNPJ inválido';
      else if (f.k === 'telefone' && digits(v).length < 10) m = 'Telefone incompleto (com DDD)';
      else if (f.k === 'email' && !validEmail(v)) m = 'E-mail inválido';
      const el = form.querySelector(`[data-k="${f.k}"]`);
      el.classList.toggle('bad', !!m); el.querySelector('.msg').textContent = m;
      if (m && !first) first = el;
    });
    if (first) { first.scrollIntoView({ behavior:'smooth', block:'center' }); toast('Confira os campos destacados'); return; }
    if (c) { c.dados = dados; saveClientes(); toast('Cliente atualizado'); location.hash = 'cliente/' + c.id; return; }
    clientes.push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), criadoEm: new Date().toISOString(), status: 'pendente',
      dados, visita: { modalidade: null, contato: '', atendimento: '', motivo: '', motivoOutro: '', obs: '', checkin: null, fotos: [] },
      proposta: null, resultado: null, visitadoEm: null, contratoEm: null });
    saveClientes(); toast('Cliente adicionado em "Clientes para Visitar"'); location.hash = '';
  });
}

const FREQS = ['1x ao mês', '2x ao mês', 'Semanal', 'Outros'];
const freqTxt = p => p.frequencia === 'Outros' ? (p.frequenciaOutro || 'Outros') : p.frequencia;
const motivoTxt = v => v.motivo === 'Outros' ? `Outros – ${v.motivoOutro || ''}` : v.motivo;

function viewCliente(id){

function fotosHTML(c){
  const v = c.visita, pres = v.modalidade === 'presencial';

  const selo = v.fotos.length ? `<span class="okk">${v.fotos.length} de 3</span>` : (pres ? '<span class="req">Mín. 1 foto</span>' : '');

        ${v.fotos.length < 3 ? `<button class="ph add" onclick="tirarFoto('${c.id}')">${pres ? I.cam + 'Tirar foto' : I.img + 'Da galeria'}</button>` : ''}
      </div>
      <p class="hint">${pres ? 'De 1 a 3 fotos, <b>somente pela câmera</b>. A data, a hora e a localização são gravadas na própria foto.'

// Trocar a modalidade apaga fotos já adicionadas (e o check-in, que só vale para presencial)
async function trocarModalidade(nova){
  const c = byId(location.hash.split('/')[1]); if (!c) return;
  const v = c.visita; if (v.modalidade === nova) return;
  if (v.modalidade && (v.fotos.length || v.checkin)) {
    const itens = [v.fotos.length ? `${v.fotos.length} foto(s)` : '', v.checkin ? 'o check-in' : ''].filter(Boolean).join(' e ');
    if (!confirm(`Mudar para visita ${nova} vai apagar ${itens}. Continuar?`)) return;
    for (const f of v.fotos) { try { await FotoDB.del(f.id); } catch (e) {} }
    v.fotos = []; v.checkin = null;
  }
  setVisita('modalidade', nova, true);
}

function setVisita(k, val, rerender){
  const c = byId(location.hash.split('/')[1]); if (!c) return;
  c.visita[k] = val; saveClientes();
  if (rerender) { const y = window.scrollY; viewCliente(c.id); window.scrollTo(0, y); }
}
function setMotivo(m){ setVisita('motivo', m, true); }

/* ---------- Check-in (geolocalização) ---------- */
function fazerCheckin(id){
  if (!('geolocation' in navigator)) return toast('Este aparelho não permite localização');
  const b = document.createElement('div'); b.className = 'busy'; b.textContent = 'Obtendo sua localização…'; document.body.appendChild(b);
  navigator.geolocation.getCurrentPosition(pos => {
    b.remove();
    const c = byId(id);
    c.visita.checkin = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, em: new Date().toISOString() };
    saveClientes(); toast('Check-in registrado'); const y = window.scrollY; viewCliente(id); window.scrollTo(0, y);
  }, err => {
    b.remove();
    toast(err.code === 1 ? 'Permita o acesso à localização nas configurações do celular' : 'Não foi possível obter a localização. Tente de novo.');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

/* ---------- Fotos com data, hora e local gravados ---------- */
let fotoCliente = null;
function tirarFoto(id){
  fotoCliente = id;
  const inp = byId(id).visita.modalidade === 'presencial' ? $('#fileCamera') : $('#fileGaleria');
  inp.value = ''; inp.click();
}
['#fileCamera', '#fileGaleria'].forEach(sel => $(sel).addEventListener('change', e => receberFoto(e, sel === '#fileCamera')));
async function receberFoto(e, camera){
  const file = e.target.files[0]; if (!file || !fotoCliente) return;
  const c = byId(fotoCliente); if (c.visita.fotos.length >= 3) return;
  // Segunda trava da visita presencial: foto recém-tirada tem data de agora; foto antiga da galeria é recusada
  if (camera && file.lastModified && Date.now() - file.lastModified > 3 * 60 * 1000) {
    toast('Na visita presencial, use apenas foto tirada agora pela câmera'); return;
  }
  const b = document.createElement('div'); b.className = 'busy'; b.textContent = 'Processando foto…'; document.body.appendChild(b);
  try {
    const agora = new Date();
    const data = await carimbarFoto(file, agora, c);
    const fid = 'f' + Date.now().toString(36);
    await FotoDB.put(fid, data);
    c.visita.fotos.push({ id: fid, em: agora.toISOString() });
    saveClientes(); toast('Foto adicionada');
  } catch (err) { toast('Não foi possível usar esta foto'); }
  b.remove(); const y = window.scrollY; viewCliente(c.id); window.scrollTo(0, y);
}

async function carregarImagem(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {} }
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function carimbarFoto(file, quando, c){
  const img = await carregarImagem(file);
  const MAX = 1600, sc = Math.min(1, MAX / Math.max(img.width, img.height));
  const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  const fs = Math.max(18, Math.round(w * 0.032)), padd = Math.round(fs * 0.7);
  const pres = c.visita.modalidade === 'presencial';
  const linhas = [pres ? brDateTime(quando) : 'Anexado em ' + brDateTime(quando).slice(0, 16), pres ? c.dados.nome : c.dados.nome + ' · visita virtual'];
  const k = c.visita.checkin; if (pres && k) linhas.push(`${k.lat.toFixed(5)}, ${k.lng.toFixed(5)}`);
  const bh = padd * 2 + fs * 1.3 * linhas.length;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, h - bh, w, bh);
  g.fillStyle = '#afcb09'; g.fillRect(0, h - bh, Math.max(6, fs * 0.3), bh);
  g.textBaseline = 'top';
  linhas.forEach((t, i) => { g.fillStyle = i === 0 ? '#fff' : 'rgba(255,255,255,.88)'; g.font = `${i === 0 ? 700 : 500} ${i === 0 ? fs : Math.round(fs * .85)}px Jost, Arial, sans-serif`;
    g.fillText(t, padd + fs * 0.4, h - bh + padd + i * fs * 1.3, w - padd * 2); });
  return cv.toDataURL('image/jpeg', 0.78);
}
async function carregarFotos(){
  for (const el of document.querySelectorAll('img[data-foto]')) { try { const d = await FotoDB.get(el.dataset.foto); if (d) el.src = d; } catch (e) {} }
}
async function removerFoto(cid, fid){
  if (!confirm('Remover esta foto?')) return;
  const c = byId(cid); c.visita.fotos = c.visita.fotos.filter(f => f.id !== fid); saveClientes();
  try { await FotoDB.del(fid); } catch (e) {}
  const y = window.scrollY; viewCliente(cid); window.scrollTo(0, y);
}
async function verFoto(fid){
  const d = await FotoDB.get(fid); if (!d) return;
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${d}" alt=""><button aria-label="Fechar">${I.x}</button>`;
  v.onclick = () => v.remove(); document.body.appendChild(v);
}

/* ---------- Sheet genérico ---------- */
function sheet(html){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

/* ---------- Formular proposta ---------- */
function abrirProposta(id, depois){
  const c = byId(id), p = c.proposta || { preco:'', frequencia:'', frequenciaOutro:'', franquia:'', excedente:'' };
  const bg = sheet(`<h3>Formular proposta</h3><p class="sub">${esc(c.dados.nome)}</p>
    <form id="propForm" novalidate>
      <label class="f" data-k="preco"><span>Preço <i>*</i></span><input name="preco" inputmode="numeric" placeholder="R$ 0,00" value="${esc(p.preco)}"><div class="msg">Informe o preço</div></label>
      <div class="f" data-k="frequencia"><span>Frequência de coleta <i>*</i></span>
        <div class="chips">${FREQS.map(o => `<button type="button" class="chip ${o === p.frequencia ? 'on' : ''}" data-freq="${o}">${o}</button>`).join('')}</div>
        <div class="msg">Escolha a frequência</div></div>
      <label class="f ${p.frequencia === 'Outros' ? '' : 'hidden'}" data-k="frequenciaOutro"><span>Descreva a frequência <i>*</i></span><input name="frequenciaOutro" value="${esc(p.frequenciaOutro)}" placeholder="Ex.: a cada 15 dias"><div class="msg">Descreva a frequência</div></label>
      <div class="grid2">
        <label class="f" data-k="franquia"><span>Franquia <i>*</i></span><div class="suffix"><input name="franquia" inputmode="numeric" placeholder="0" value="${esc(p.franquia)}"><em>kg/mês</em></div><div class="msg">Informe a franquia</div></label>
        <label class="f" data-k="excedente"><span>Excedente <i>*</i></span><div class="suffix"><input name="excedente" inputmode="numeric" placeholder="R$ 0,00" value="${esc(p.excedente)}"><em>/kg</em></div><div class="msg">Informe o excedente</div></label>
      </div>
      <button class="btn btn-green" type="submit" style="margin-top:6px">Salvar proposta</button>
      <button class="btn btn-ghost" type="button" data-close>Cancelar</button>
    </form>`);
  const f = bg.querySelector('#propForm'); let freq = p.frequencia;
  f.preco.oninput = e => e.target.value = maskMoney(e.target.value);
  f.excedente.oninput = e => e.target.value = maskMoney(e.target.value);
  f.franquia.oninput = e => e.target.value = maskInt(e.target.value);
  f.addEventListener('input', e => e.target.closest('.f')?.classList.remove('bad'));
  f.querySelectorAll('[data-freq]').forEach(b => b.onclick = () => {
    freq = b.dataset.freq; f.querySelectorAll('[data-freq]').forEach(x => x.classList.toggle('on', x === b));
    f.querySelector('[data-k="frequencia"]').classList.remove('bad');
    f.querySelector('[data-k="frequenciaOutro"]').classList.toggle('hidden', freq !== 'Outros');
  });
  f.onsubmit = e => {
    e.preventDefault();
    const np = { preco: f.preco.value, frequencia: freq, frequenciaOutro: f.frequenciaOutro.value.trim(), franquia: f.franquia.value, excedente: f.excedente.value };
    const bad = { preco: !np.preco, frequencia: !np.frequencia, frequenciaOutro: np.frequencia === 'Outros' && !np.frequenciaOutro, franquia: !np.franquia, excedente: !np.excedente };
    Object.entries(bad).forEach(([k, b]) => f.querySelector(`[data-k="${k}"]`).classList.toggle('bad', b));
    if (Object.values(bad).some(Boolean)) return;
    c.proposta = np; saveClientes(); bg.remove(); toast('Proposta salva');
    if (depois) return depois();
    const y = window.scrollY; viewCliente(id); window.scrollTo(0, y);
  };
}

/* ---------- Finalizar visita ---------- */
function pendencias(c){
  const v = c.visita, p = [];
  if (!v.modalidade) p.push('Escolher a modalidade da visita');
  if (v.modalidade === 'presencial') {
    if (!v.checkin) p.push('Fazer o check-in no local');
    if (!v.fotos.length) p.push('Incluir pelo menos 1 foto do local');
  }
  if (v.motivo === 'Outros' && !v.motivoOutro.trim()) p.push('Descrever o motivo da visita');
  return p;
}
function abrirFinalizar(id){
  const c = byId(id), p = pendencias(c);
  if (p.length) return sheet(`<h3>Falta pouco</h3><p class="sub">Para finalizar a visita, complete:</p>
    <div class="missing"><ul>${p.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <button class="btn btn-green" data-close>Entendi</button>`);
  const bg = sheet(`<h3>Finalizar visita</h3><p class="sub">${esc(c.dados.nome)} · Como terminou a visita?</p>
    <button class="opt" data-r="proposta"><div class="ic" style="background:var(--blue-bg);color:var(--blue)">${I.send}</div><div><b>Proposta enviada</b><small>Vai para Visitas Realizadas</small></div></button>
    <button class="opt" data-r="contrato"><div class="ic" style="background:var(--ok-bg);color:var(--ok)">${I.doc}</div><div><b>Contrato fechado</b><small>Vai para Visitas Realizadas e Contratos Fechados</small></div></button>
    ${!c.proposta ? '<p class="hint" style="margin:0 0 12px">Em seguida você vai preencher a proposta (preço, frequência, franquia e excedente).</p>' : ''}
    <button class="btn btn-ghost" data-close>Cancelar</button>`);
  bg.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = b.dataset.r; bg.remove();
    const concluir = () => finalizar(id, r);
    c.proposta ? concluir() : abrirProposta(id, concluir);
  });
}
function finalizar(id, resultado){
  const c = byId(id), hoje = isoDate(new Date());
  c.status = 'realizada'; c.resultado = resultado; c.visitadoEm = hoje; c.finalizadoEm = new Date().toISOString();
  c.contratoEm = resultado === 'contrato' ? hoje : null;
  saveClientes();
  toast(resultado === 'contrato' ? 'Contrato fechado registrado! 🎉' : 'Visita registrada com proposta enviada');
  location.hash = 'visitar';
}
function converterContrato(id){
  const c = byId(id);
  if (!confirm(`Registrar contrato fechado hoje com ${c.dados.nome}?`)) return;
  c.resultado = 'contrato'; c.contratoEm = isoDate(new Date()); saveClientes();
  toast('Contrato fechado registrado! 🎉'); viewCliente(id);
}

/* ---------- Cliente com visita realizada (somente leitura) ---------- */
function viewClienteRealizado(c){
  topbar(c.dados.nome);
  const v = c.visita;
  const res = c.resultado === 'contrato'
    ? `<div class="result contrato">${I.doc}<div>Contrato fechado em ${brDate(c.contratoEm)}<br><small style="font-weight:500">Visita em ${brDate(c.visitadoEm)}</small></div></div>`
    : `<div class="result proposta">${I.send}<div>Proposta enviada em ${brDate(c.visitadoEm)}</div></div>`;
  $('#view').innerHTML = `${res}
    ${dadosHTML(c, false)}
    <div class="sec"><h3>Visita</h3><dl class="kv">
      <dt>Modalidade</dt><dd style="text-transform:capitalize">${esc(v.modalidade)}</dd>
      ${v.contato ? `<dt>Contato</dt><dd>${esc(v.contato)}</dd>` : ''}
      ${v.atendimento ? `<dt>Atendimento</dt><dd>${esc(v.atendimento)}</dd>` : ''}
      ${v.motivo ? `<dt>Motivo</dt><dd>${esc(motivoTxt(v))}</dd>` : ''}
      ${v.obs ? `<dt>Observações</dt><dd style="white-space:pre-wrap">${esc(v.obs)}</dd>` : ''}
    </dl>
    ${v.checkin ? `<div style="margin-top:14px">${checkinHTML(v)}</div>` : ''}

    </div>
    ${propostaHTML(c, false)}
    ${c.resultado === 'proposta' ? `<div class="bottom-bar"><button class="btn btn-green" onclick="converterContrato('${c.id}')">Cliente aceitou: registrar contrato fechado</button></div>` : ''}`;
  carregarFotos();
}

/* =========================================================
   VISITAS REALIZADAS: CALENDÁRIO (MÊS ATUAL E ANTERIOR)
   ========================================================= */
let calState = null;
function selDia(iso){ calState.sel = iso; viewRealizadas(); }
function trocaMes(t){ calState.tab = t; calState.sel = ''; viewRealizadas(); }

function viewRealizadas(){
  topbar('Visitas Realizadas', '');
  const hoje = new Date();
  const atual = { y: hoje.getFullYear(), m: hoje.getMonth() };
  const ant = atual.m === 0 ? { y: atual.y - 1, m: 11 } : { y: atual.y, m: atual.m - 1 };
  if (!calState) calState = { tab: 'atual', sel: isoDate(hoje) };
  const mes = calState.tab === 'atual' ? atual : ant;

  const porDia = {};
  realizadas().forEach(c => (porDia[c.visitadoEm] = porDia[c.visitadoEm] || []).push(c));
  const prefix = `${mes.y}-${pad(mes.m + 1)}`;
  const doMes = realizadas().filter(c => c.visitadoEm.startsWith(prefix));
  const fechadosMes = contratos().filter(c => (c.contratoEm || '').startsWith(prefix)).length;
  const primeiroDia = new Date(mes.y, mes.m, 1).getDay(), nDias = new Date(mes.y, mes.m + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < primeiroDia; i++) cells += '<div class="day out"></div>';
  for (let d = 1; d <= nDias; d++) {
    const iso = `${prefix}-${pad(d)}`, v = porDia[iso] || [];
    const nc = v.filter(c => c.resultado === 'contrato').length, np = v.length - nc;
    const cls = ['day', v.length ? 'has' : '', iso === isoDate(hoje) ? 'today' : '', iso === calState.sel ? 'sel' : ''].join(' ');
    cells += `<button class="${cls}" onclick="selDia('${iso}')">${d}${v.length ? `<span class="cnt">${v.length}</span><span class="dots">${np ? '<i class="dot p"></i>' : ''}${nc ? '<i class="dot c"></i>' : ''}</span>` : ''}</button>`;
  }

  const sel = calState.sel && calState.sel.startsWith(prefix) ? calState.sel : null;
  const doDia = sel ? (porDia[sel] || []) : [];
  let titulo = '';
  if (sel) { const [sy, sm, sd] = sel.split('-').map(Number); const ds = new Date(sy, sm - 1, sd).toLocaleDateString('pt-BR', { weekday: 'long' });
    titulo = `<div class="day-title">${sd} de ${MESES[sm - 1]} de ${sy}<small>${ds} · ${doDia.length} visita(s) · ${doDia.filter(c => c.resultado === 'contrato').length} contrato(s)</small></div>`; }

  $('#view').innerHTML = `
    <div class="seg">
      <button class="${calState.tab === 'anterior' ? 'on' : ''}" onclick="trocaMes('anterior')">${MESES[ant.m]} ${ant.y}</button>
      <button class="${calState.tab === 'atual' ? 'on' : ''}" onclick="trocaMes('atual')">${MESES[atual.m]} ${atual.y}</button>
    </div>
    <div class="cal">
      <div class="cal-sum"><div><b>${doMes.length}</b>visitas no mês</div><div><b>${fechadosMes}</b>contratos fechados</div></div>
      <div class="wk"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
      <div class="days">${cells}</div>
      <div class="legend"><span><i class="dot p"></i>Proposta enviada</span><span><i class="dot c"></i>Contrato fechado</span></div>
    </div>
    ${sel ? titulo + (doDia.length ? `<div class="list">${doDia.map(clienteCard).join('')}</div>` : '<div class="empty" style="padding:24px">Nenhuma visita neste dia.</div>')
          : '<div class="empty" style="padding:24px">Toque em um dia do calendário.</div>'}`;
}

/* =========================================================
   INÍCIO
   ========================================================= */
if (sessao) start(); else $('#login').classList.remove('hidden');
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
